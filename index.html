<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cukr výzva</title>
  <style>
    :root {
      --bg: #f0ebe3;
      --card: #ffffff;
      --green: #5ab5a5;
      --green-light: #aedfda;
      --red: #e05050;
      --today: #3b72d4;
      --text: #222222;
      --muted: #888888;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text);
      padding: 28px 16px 48px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 28px;
    }
    header h1 { font-size: 1.9rem; font-weight: 700; }
    header .subtitle { color: var(--muted); margin-top: 5px; font-size: 0.95rem; }

    /* Stat cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px 16px;
    }
    .stat-card .label { font-size: 0.75rem; color: var(--muted); margin-bottom: 8px; }
    .stat-card .value { font-size: 2.2rem; font-weight: 700; line-height: 1; }
    .stat-card .sub   { font-size: 0.75rem; color: var(--muted); margin-top: 5px; }
    .stat-card .streak{ font-size: 0.78rem; margin-top: 5px; }

    /* Progress */
    .progress-section {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 16px;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 10px;
    }
    .progress-track {
      background: #e5dfd7;
      border-radius: 999px;
      height: 8px;
      overflow: hidden;
    }
    .progress-fill {
      background: var(--green);
      height: 100%;
      border-radius: 999px;
      transition: width 0.6s ease;
    }

    /* Player cards */
    .players-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 28px;
    }
    .player-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 22px 20px;
    }
    .player-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: #ddd6f0;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.8rem; color: #6b56b0;
      flex-shrink: 0;
    }
    .player-name  { font-weight: 600; font-size: 1rem; }
    .player-rate  { font-size: 0.8rem; color: var(--muted); margin-top: 1px; }

    .player-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
      text-align: center;
    }
    .pstat-val      { font-size: 1.6rem; font-weight: 700; color: var(--green); }
    .pstat-val.red  { color: var(--red); }
    .pstat-lbl      { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; padding: 10px;
      border: 1.5px solid #d8d0c6;
      border-radius: 9px;
      background: transparent;
      font-size: 0.85rem; color: var(--text);
      text-decoration: none;
      cursor: pointer;
    }
    .btn:hover { background: #f5f0ea; }

    /* Calendar */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .calendar-header h2 { font-size: 1rem; font-weight: 600; }

    .legend {
      display: flex; gap: 14px;
      font-size: 0.75rem; color: var(--muted);
    }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-dot  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    .day {
      aspect-ratio: 1;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; font-weight: 500;
      background: #e5dfd7; color: var(--muted);
    }
    .day.both   { background: var(--green); color: #fff; }
    .day.one    { background: var(--green-light); color: var(--text); }
    .day.fail   { background: #fde8e8; color: var(--red); }
    .day.today  { background: #fff; color: var(--text); border: 2.5px solid var(--today); }

    /* Loading / error */
    #app.loading { text-align: center; padding: 80px 0; color: var(--muted); font-size: 1.1rem; }
    #app.error   { text-align: center; padding: 60px 20px; }
    .error-box   { background: #fff; border-radius: var(--radius); padding: 32px; display: inline-block; max-width: 500px; }
    .error-box h2 { color: var(--red); margin-bottom: 10px; }
    .error-box p  { font-size: 0.9rem; color: var(--muted); line-height: 1.6; }
    .error-box code { background: #f5f0ea; padding: 2px 6px; border-radius: 4px; font-size: 0.85rem; }

    @media (max-width: 640px) {
      .stats-grid   { grid-template-columns: repeat(2, 1fr); }
      .players-grid { grid-template-columns: 1fr; }
      .calendar-grid{ grid-template-columns: repeat(5, 1fr); }
      header h1     { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
<div class="container">
  <div id="app" class="loading">Načítám data…</div>
</div>

<script>
// ─── KONFIGURACE ────────────────────────────────────────────────────────────
// Vyplňte ID vašeho Google Sheetu (část URL mezi /d/ a /edit)
const SHEET_ID = '1pRd1rCylamJtQV20x3LvAmAV6LlbLaYNvBMWzepXRu4';
// ────────────────────────────────────────────────────────────────────────────

const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;

const DAYS_CS   = ['neděle','pondělí','úterý','středa','čtvrtek','pátek','sobota'];
const MONTHS_CS = ['ledna','února','března','dubna','května','června','července','srpna','září','října','listopadu','prosince'];

// ─── CSV parsing ────────────────────────────────────────────────────────────
function parseLine(line) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    if (line[i] === '"') { q = !q; continue; }
    if (line[i] === ',' && !q) { out.push(cur.trim()); cur = ''; continue; }
    cur += line[i];
  }
  out.push(cur.trim());
  return out;
}

function parseDate(str) {
  str = (str || '').replace(/"/g,'').trim();
  let m;
  if ((m = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))
    return new Date(+m[1], +m[2]-1, +m[3]);
  if ((m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/)))
    return new Date(+m[3], +m[1]-1, +m[2]);
  if ((m = str.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/)))
    return new Date(+m[3], +m[2]-1, +m[1]);
  return null;
}

function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = parseLine(lines[0]);
  const p1Name = headers[1] || 'Ty';
  const p2Name = headers[2] || 'Petr';

  const rows = lines.slice(1).map(line => {
    const v = parseLine(line);
    const date = parseDate(v[0]);
    if (!date) return null;
    return { date, key: dateKey(date), p1: (v[1]||'').trim(), p2: (v[2]||'').trim() };
  }).filter(Boolean);

  return { p1Name, p2Name, rows };
}

// ─── Statistics ──────────────────────────────────────────────────────────────
function stats(rows, playerKey, today) {
  let clean = 0, fail = 0, streak = 0, inStreak = true;

  // Go backwards from today to compute streak
  const past = rows.filter(r => r.date < today).sort((a,b) => b.date - a.date);
  for (const r of past) {
    if (r[playerKey] === '1') { if (inStreak) streak++; clean++; }
    else { inStreak = false; fail++; }
  }
  const total = clean + fail;
  return { clean, fail, streak, rate: total > 0 ? Math.round(clean/total*100) : null };
}

// ─── Render ───────────────────────────────────────────────────────────────────
function render({ p1Name, p2Name, rows }) {
  const today = new Date(); today.setHours(0,0,0,0);
  const todayKey = dateKey(today);

  const totalDays = rows.length;
  const challengeDay = rows.filter(r => r.date <= today).length;
  const daysLeft     = rows.filter(r => r.date > today).length;
  const progress     = totalDays > 0 ? Math.round(challengeDay / totalDays * 100) : 0;

  const s1 = stats(rows, 'p1', today);
  const s2 = stats(rows, 'p2', today);

  const dayName  = DAYS_CS[today.getDay()];
  const dateStr  = `${today.getDate()}. ${MONTHS_CS[today.getMonth()]}`;

  document.getElementById('app').className = '';
  document.getElementById('app').innerHTML = `
    <header>
      <h1>🥗 Bez sladkého — ${totalDays} dní</h1>
      <div class="subtitle">Dnes: ${dayName} ${dateStr}</div>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">Zbývá dnů</div>
        <div class="value">${daysLeft}</div>
        <div class="sub">do konce výzvy</div>
      </div>
      <div class="stat-card">
        <div class="label">Den výzvy</div>
        <div class="value">${challengeDay}</div>
        <div class="sub">z ${totalDays}</div>
      </div>
      <div class="stat-card">
        <div class="label">${p1Name} — čistých dnů</div>
        <div class="value">${s1.clean}</div>
        <div class="streak">${s1.streak > 0 ? `🔥 série ${s1.streak} dní` : 'zatím bez série'}</div>
      </div>
      <div class="stat-card">
        <div class="label">${p2Name} — čistých dnů</div>
        <div class="value">${s2.clean}</div>
        <div class="streak">${s2.streak > 0 ? `🔥 série ${s2.streak} dní` : 'zatím bez série'}</div>
      </div>
    </div>

    <div class="progress-section">
      <div class="progress-header">
        <span>Průběh výzvy</span>
        <span>${progress} %</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" style="width:${progress}%"></div>
      </div>
    </div>

    <div class="players-grid">
      ${playerCard(p1Name, s1, `Označit svůj dnešek`)}
      ${playerCard(p2Name, s2, `Označit ${p2Name}ův dnešek`)}
    </div>

    <div class="calendar-section">
      <div class="calendar-header">
        <h2>Přehled — ${totalDays} dní</h2>
        <div class="legend">
          <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div> oba čistí</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--green-light)"></div> jeden čistý</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div> prohřešek</div>
        </div>
      </div>
      <div class="calendar-grid">
        ${rows.map((r,i) => dayCell(r, i+1, today, todayKey)).join('')}
      </div>
    </div>
  `;
}

function playerCard(name, s, btnLabel) {
  const rateText = s.rate !== null ? `${s.rate} % úspěšnost` : 'zatím bez záznamu';
  const initials = name.substring(0,2).toUpperCase();
  return `
    <div class="player-card">
      <div class="player-header">
        <div class="avatar">${initials}</div>
        <div>
          <div class="player-name">${name}</div>
          <div class="player-rate">${rateText}</div>
        </div>
      </div>
      <div class="player-stats">
        <div>
          <div class="pstat-val">${s.clean}</div>
          <div class="pstat-lbl">bez sladkého</div>
        </div>
        <div>
          <div class="pstat-val ${s.fail > 0 ? 'red' : ''}">${s.fail}</div>
          <div class="pstat-lbl">prohřešků</div>
        </div>
        <div>
          <div class="pstat-val">${s.streak}</div>
          <div class="pstat-lbl">série dnů</div>
        </div>
      </div>
      <a href="${SHEET_URL}" target="_blank" class="btn">⊙ ${btnLabel}</a>
    </div>
  `;
}

function dayCell(row, n, today, todayKey) {
  let cls = 'day';
  if (row.key === todayKey) {
    cls += ' today';
  } else if (row.date < today) {
    const b1 = row.p1 === '1', b2 = row.p2 === '1';
    if (b1 && b2) cls += ' both';
    else if (b1 || b2) cls += ' one';
    else cls += ' fail';
  }
  return `<div class="${cls}">${n}</div>`;
}

// ─── Error screen ─────────────────────────────────────────────────────────────
function showError(msg) {
  document.getElementById('app').className = 'error';
  document.getElementById('app').innerHTML = `
    <div class="error-box">
      <h2>⚠️ Chyba načítání</h2>
      <p>${msg}</p>
      <p style="margin-top:12px">
        Zkontrolujte:<br>
        1. <code>SHEET_ID</code> v kódu stránky<br>
        2. Sheet je sdílen jako <em>Kdokoli s odkazem může zobrazit</em><br>
        3. Sheet je publikován: <em>Soubor → Sdílet → Publikovat na webu → CSV</em>
      </p>
    </div>
  `;
}

// ─── Main ─────────────────────────────────────────────────────────────────────
async function main() {
  if (SHEET_ID === 'YOUR_SHEET_ID_HERE') {
    showError('Nevyplněno <code>SHEET_ID</code>. Otevřete <code>index.html</code> a doplňte ID vašeho Google Sheetu.');
    return;
  }
  try {
    const resp = await fetch(CSV_URL);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const text = await resp.text();
    if (text.includes('UNAUTHENTICATED') || text.includes('Sign in')) {
      throw new Error('Sheet není veřejně přístupný.');
    }
    render(parseCSV(text));
  } catch (e) {
    showError(`Nepodařilo se načíst data. ${e.message}`);
  }
}

main();
</script>
</body>
</html>
